<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Andika Dwi Saputra</title>
  <meta name="robots" content="noindex">
  <!-- Self-contained on purpose: GitHub Pages serves this file at any missing
       path, so relative links to css/ would break on nested URLs. -->
  <style>
    :root { --sky-a: #71b7f4; --sky-b: #5788b3; --cream: #fff9f1; --ink: #060606; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(180deg, var(--sky-a), var(--sky-b)); color: var(--cream);
      font: 400 17px/1.6 system-ui, sans-serif; text-align: center;
    }
    main { max-width: 34rem; display: grid; gap: 18px; justify-items: center; }
    .code { font: 800 clamp(6rem, 30vw, 12rem)/0.8 system-ui, sans-serif; letter-spacing: -0.06em; margin: 0; }
    h1 { font: 700 clamp(1.6rem, 5vw, 2.4rem)/1.1 system-ui, sans-serif; margin: 0; }
    p { margin: 0; opacity: .88; }
    .id { font-size: 15px; opacity: .7; }
    a {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 24px; border-radius: 999px;
      background: var(--cream); color: var(--ink); text-decoration: none;
      font: 500 12px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    a:hover { transform: scale(1.04); }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page wandered off.</h1>
    <p>The link might be old, or it never existed. The homepage is still here though.</p>
    <p class="id" lang="id">Halamannya nyasar. Tapi halaman utamanya masih ada kok.</p>
    <a href="/" data-home>Go home · Ke beranda</a>
  </main>
  <script>
    // Project pages live under /<repo>/; send people to that root, not the domain root.
    const [first] = location.pathname.split("/").filter(Boolean);
    const isProjectPage = location.hostname.endsWith("github.io") && first && !location.hostname.startsWith(first);
    if (isProjectPage) document.querySelector("[data-home]").href = `/${first}/`;
  </script>
</body>
</html>
